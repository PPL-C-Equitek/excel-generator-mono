name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy-backend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          cd backend
          coverage run --rcfile=.coveragerc manage.py test api
          echo "BACKEND_COVERAGE=$(coverage report --format=total)" >> $GITHUB_ENV
          coverage report
          coverage xml

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Update backend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            mkdir -p .github/badges
            LABEL="backend coverage"
            MESSAGE="${BACKEND_COVERAGE}%"
            COLOR="#e05d44"
            if [ "$BACKEND_COVERAGE" -ge 90 ]; then
              COLOR="#4c1"
            elif [ "$BACKEND_COVERAGE" -ge 75 ]; then
              COLOR="#dfb317"
            elif [ "$BACKEND_COVERAGE" -ge 60 ]; then
              COLOR="#fe7d37"
            fi

            LABEL_WIDTH=$(( ${#LABEL} * 6 + 10 ))
            MESSAGE_WIDTH=$(( ${#MESSAGE} * 7 + 10 ))
            TOTAL_WIDTH=$(( LABEL_WIDTH + MESSAGE_WIDTH ))

            {
              printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="%s: %s">\n' "${TOTAL_WIDTH}" "${LABEL}" "${MESSAGE}"
              printf '  <linearGradient id="s" x2="0" y2="100%%">\n'
              printf '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>\n'
              printf '    <stop offset="1" stop-opacity=".1"/>\n'
              printf '  </linearGradient>\n'
              printf '  <clipPath id="r">\n'
              printf '    <rect width="%s" height="20" rx="3" fill="#fff"/>\n' "${TOTAL_WIDTH}"
              printf '  </clipPath>\n'
              printf '  <g clip-path="url(#r)">\n'
              printf '    <rect width="%s" height="20" fill="#555"/>\n' "${LABEL_WIDTH}"
              printf '    <rect x="%s" width="%s" height="20" fill="%s"/>\n' "${LABEL_WIDTH}" "${MESSAGE_WIDTH}" "${COLOR}"
              printf '    <rect width="%s" height="20" fill="url(#s)"/>\n' "${TOTAL_WIDTH}"
              printf '  </g>\n'
              printf '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">\n'
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '  </g>\n'
              printf '</svg>\n'
            } > .github/badges/backend-coverage.svg

            if git diff --quiet -- .github/badges/backend-coverage.svg; then
              echo "No backend badge changes."
              exit 0
            fi

            git add .github/badges/backend-coverage.svg
            git commit -m "ci: update backend coverage badge" || true
            if git push origin main; then
              echo "Backend coverage badge updated."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep 2
          done

          echo "Badge update skipped after retries."

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cat > ~/apps/.env << 'ENVEOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            ENVEOF

            cd ~/apps/excel-generator-mono
            git pull origin main
            bash scripts/deploy-backend.sh
