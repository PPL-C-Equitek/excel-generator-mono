name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy-backend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          cd backend
          coverage run --rcfile=.coveragerc manage.py test api
          echo "BACKEND_COVERAGE=$(coverage report --format=total)" >> $GITHUB_ENV
          coverage report
          coverage xml

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Generate backend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p .github/badges
          LABEL="backend coverage"
          MESSAGE="${BACKEND_COVERAGE}%"
          COLOR="#e05d44"
          if [ "$BACKEND_COVERAGE" -ge 90 ]; then
            COLOR="#4c1"
          elif [ "$BACKEND_COVERAGE" -ge 75 ]; then
            COLOR="#dfb317"
          elif [ "$BACKEND_COVERAGE" -ge 60 ]; then
            COLOR="#fe7d37"
          fi

          LABEL_WIDTH=$(( ${#LABEL} * 6 + 10 ))
          MESSAGE_WIDTH=$(( ${#MESSAGE} * 7 + 10 ))
          TOTAL_WIDTH=$(( LABEL_WIDTH + MESSAGE_WIDTH ))

          cat > .github/badges/backend-coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="${TOTAL_WIDTH}" height="20" role="img" aria-label="${LABEL}: ${MESSAGE}">
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="${TOTAL_WIDTH}" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="${LABEL_WIDTH}" height="20" fill="#555"/>
              <rect x="${LABEL_WIDTH}" width="${MESSAGE_WIDTH}" height="20" fill="${COLOR}"/>
              <rect width="${TOTAL_WIDTH}" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
              <text x="$(( LABEL_WIDTH / 2 ))" y="15" fill="#010101" fill-opacity=".3">${LABEL}</text>
              <text x="$(( LABEL_WIDTH / 2 ))" y="14">${LABEL}</text>
              <text x="$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" y="15" fill="#010101" fill-opacity=".3">${MESSAGE}</text>
              <text x="$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" y="14">${MESSAGE}</text>
            </g>
          </svg>
          EOF

      - name: Commit backend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update backend coverage badge"
          file_pattern: .github/badges/backend-coverage.svg

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cat > ~/apps/.env << 'ENVEOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            ENVEOF

            cd ~/apps/excel-generator-mono
            git pull origin main
            bash scripts/deploy-backend.sh
