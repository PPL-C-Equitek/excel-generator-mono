name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy-backend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy-backend.sh'
      - '.github/workflows/backend.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Lint
        run: |
          cd backend
          pip install ruff
          ruff check .

      - name: Check migrations
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run

      - name: Run unit tests with coverage
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          DJANGO_SECRET_KEY: test-secret-key
          DJANGO_DEBUG: 'True'
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          cd backend
          coverage run --rcfile=.coveragerc manage.py test
          coverage report
          coverage xml
          coverage json -o coverage.json
          BACKEND_LINES_COVERAGE=$(python -c "import json; t=json.load(open('coverage.json'))['totals']; print(round((t['covered_lines']/t['num_statements']*100) if t['num_statements'] else 100))")
          BACKEND_BRANCHES_COVERAGE=$(python -c "import json; t=json.load(open('coverage.json'))['totals']; nb=t.get('num_branches',0); cb=t.get('covered_branches',0); print(round((cb/nb*100) if nb else 100))")
          if [ "$BACKEND_LINES_COVERAGE" -le "$BACKEND_BRANCHES_COVERAGE" ]; then
            BACKEND_COVERAGE="$BACKEND_LINES_COVERAGE"
          else
            BACKEND_COVERAGE="$BACKEND_BRANCHES_COVERAGE"
          fi
          echo "BACKEND_COVERAGE=${BACKEND_COVERAGE}" >> $GITHUB_ENV

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/coverage.json

      - name: Update backend coverage badge
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            TARGET_BRANCH="${GITHUB_HEAD_REF}"
          fi
          echo "Updating backend badge on branch: ${TARGET_BRANCH}"

          for attempt in 1 2 3; do
            git fetch origin "${TARGET_BRANCH}"
            git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

            mkdir -p .github/badges
            LABEL="backend coverage"
            MESSAGE="${BACKEND_COVERAGE}%"
            SCORE="$BACKEND_COVERAGE"
            if [ "$SCORE" -lt 0 ]; then
              SCORE=0
            elif [ "$SCORE" -gt 100 ]; then
              SCORE=100
            fi
            HUE=$(( SCORE * 120 / 100 ))
            COLOR="hsl(${HUE}, 85%, 40%)"

            LABEL_WIDTH=$(( ${#LABEL} * 6 + 10 ))
            MESSAGE_WIDTH=$(( ${#MESSAGE} * 7 + 10 ))
            TOTAL_WIDTH=$(( LABEL_WIDTH + MESSAGE_WIDTH ))

            {
              printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="%s: %s">\n' "${TOTAL_WIDTH}" "${LABEL}" "${MESSAGE}"
              printf '  <linearGradient id="s" x2="0" y2="100%%">\n'
              printf '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>\n'
              printf '    <stop offset="1" stop-opacity=".1"/>\n'
              printf '  </linearGradient>\n'
              printf '  <clipPath id="r">\n'
              printf '    <rect width="%s" height="20" rx="3" fill="#fff"/>\n' "${TOTAL_WIDTH}"
              printf '  </clipPath>\n'
              printf '  <g clip-path="url(#r)">\n'
              printf '    <rect width="%s" height="20" fill="#555"/>\n' "${LABEL_WIDTH}"
              printf '    <rect x="%s" width="%s" height="20" fill="%s"/>\n' "${LABEL_WIDTH}" "${MESSAGE_WIDTH}" "${COLOR}"
              printf '    <rect width="%s" height="20" fill="url(#s)"/>\n' "${TOTAL_WIDTH}"
              printf '  </g>\n'
              printf '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">\n'
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '  </g>\n'
              printf '</svg>\n'
            } > .github/badges/backend-coverage.svg

            if git diff --quiet -- .github/badges/backend-coverage.svg; then
              echo "No backend badge changes."
              exit 0
            fi

            git add .github/badges/backend-coverage.svg
            git commit -m "ci: update backend coverage badge" || true
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              echo "Backend coverage badge updated."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep 2
          done

          echo "Badge update skipped after retries."

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download backend coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage
          path: backend

      - name: SonarCloud scan (backend)
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_BACKEND }}
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.inclusions=**/*.py
            -Dsonar.test.inclusions=**/tests/**/*.py,**/tests.py,**/test_*.py,**/*_test.py
            -Dsonar.exclusions=**/migrations/**,**/management/**
            -Dsonar.coverage.exclusions=**/tests/**,**/tests.py,**/test_*.py,**/*_test.py,**/migrations/**,**/management/**,config/**/*.py,manage.py,**/apps.py,**/admin.py,**/urls.py,**/wsgi.py,**/asgi.py
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  deploy:
    runs-on: ubuntu-latest
    needs: [test, sonar]
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cat > ~/apps/.env << 'ENVEOF'
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ vars.DJANGO_ALLOWED_HOSTS }}
            DJANGO_CORS_ALLOWED_ORIGINS=${{ vars.DJANGO_CORS_ALLOWED_ORIGINS }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            OPENAI_SYSTEM_PROMPT=${{ vars.OPENAI_SYSTEM_PROMPT }}
            ENVEOF

            cd ~/apps/excel-generator-mono
            git pull origin main
            bash scripts/deploy-backend.sh
