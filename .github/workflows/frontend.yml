name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/deploy-frontend.sh'
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build

      - name: Run unit tests with coverage
        run: |
          cd frontend
          npm run test:coverage
          FRONTEND_LINES_COVERAGE=$(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); console.log(Math.round(summary.total.lines.pct));")
          FRONTEND_BRANCHES_COVERAGE=$(node -e "const fs=require('fs'); const summary=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8')); console.log(Math.round(summary.total.branches.pct));")
          if [ "$FRONTEND_LINES_COVERAGE" -le "$FRONTEND_BRANCHES_COVERAGE" ]; then
            FRONTEND_COVERAGE="$FRONTEND_LINES_COVERAGE"
          else
            FRONTEND_COVERAGE="$FRONTEND_BRANCHES_COVERAGE"
          fi
          echo "FRONTEND_COVERAGE=${FRONTEND_COVERAGE}" >> $GITHUB_ENV

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Update frontend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            mkdir -p .github/badges
            LABEL="frontend coverage"
            MESSAGE="${FRONTEND_COVERAGE}%"
            SCORE="$FRONTEND_COVERAGE"
            if [ "$SCORE" -lt 0 ]; then
              SCORE=0
            elif [ "$SCORE" -gt 100 ]; then
              SCORE=100
            fi
            HUE=$(( SCORE * 120 / 100 ))
            COLOR="hsl(${HUE}, 85%, 40%)"

            LABEL_WIDTH=$(( ${#LABEL} * 6 + 10 ))
            MESSAGE_WIDTH=$(( ${#MESSAGE} * 7 + 10 ))
            TOTAL_WIDTH=$(( LABEL_WIDTH + MESSAGE_WIDTH ))

            {
              printf '<svg xmlns="http://www.w3.org/2000/svg" width="%s" height="20" role="img" aria-label="%s: %s">\n' "${TOTAL_WIDTH}" "${LABEL}" "${MESSAGE}"
              printf '  <linearGradient id="s" x2="0" y2="100%%">\n'
              printf '    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>\n'
              printf '    <stop offset="1" stop-opacity=".1"/>\n'
              printf '  </linearGradient>\n'
              printf '  <clipPath id="r">\n'
              printf '    <rect width="%s" height="20" rx="3" fill="#fff"/>\n' "${TOTAL_WIDTH}"
              printf '  </clipPath>\n'
              printf '  <g clip-path="url(#r)">\n'
              printf '    <rect width="%s" height="20" fill="#555"/>\n' "${LABEL_WIDTH}"
              printf '    <rect x="%s" width="%s" height="20" fill="%s"/>\n' "${LABEL_WIDTH}" "${MESSAGE_WIDTH}" "${COLOR}"
              printf '    <rect width="%s" height="20" fill="url(#s)"/>\n' "${TOTAL_WIDTH}"
              printf '  </g>\n'
              printf '  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">\n'
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH / 2 ))" "${LABEL}"
              printf '    <text x="%s" y="15" fill="#010101" fill-opacity=".3">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '    <text x="%s" y="14">%s</text>\n' "$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" "${MESSAGE}"
              printf '  </g>\n'
              printf '</svg>\n'
            } > .github/badges/frontend-coverage.svg

            if git diff --quiet -- .github/badges/frontend-coverage.svg; then
              echo "No frontend badge changes."
              exit 0
            fi

            git add .github/badges/frontend-coverage.svg
            git commit -m "ci: update frontend coverage badge" || true
            if git push origin main; then
              echo "Frontend coverage badge updated."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep 2
          done

          echo "Badge update skipped after retries."

  sonar:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: .

      - name: SonarCloud scan (frontend)
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY_FRONTEND }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  deploy:
    runs-on: ubuntu-latest
    needs: [test, sonar]
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cat > ~/apps/.env << 'ENVEOF'
            POSTGRES_DB=${{ vars.POSTGRES_DB }}
            POSTGRES_USER=${{ vars.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ vars.DJANGO_ALLOWED_HOSTS }}
            DJANGO_CORS_ALLOWED_ORIGINS=${{ vars.DJANGO_CORS_ALLOWED_ORIGINS }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
            OPENAI_SYSTEM_PROMPT=${{ vars.OPENAI_SYSTEM_PROMPT }}
            ENVEOF

            cd ~/apps/excel-generator-mono
            git pull origin main
            bash scripts/deploy-frontend.sh
