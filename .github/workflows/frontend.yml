name: Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/deploy-frontend.sh'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build

      - name: Run unit tests with coverage
        run: |
          cd frontend
          npm run test:coverage
          FRONTEND_COVERAGE=$(node - <<'NODE'
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          console.log(Math.round(summary.total.lines.pct));
          NODE
          )
          echo "FRONTEND_COVERAGE=${FRONTEND_COVERAGE}" >> $GITHUB_ENV

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Update frontend coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            mkdir -p .github/badges
            LABEL="frontend coverage"
            MESSAGE="${FRONTEND_COVERAGE}%"
            COLOR="#e05d44"
            if [ "$FRONTEND_COVERAGE" -ge 90 ]; then
              COLOR="#4c1"
            elif [ "$FRONTEND_COVERAGE" -ge 75 ]; then
              COLOR="#dfb317"
            elif [ "$FRONTEND_COVERAGE" -ge 60 ]; then
              COLOR="#fe7d37"
            fi

            LABEL_WIDTH=$(( ${#LABEL} * 6 + 10 ))
            MESSAGE_WIDTH=$(( ${#MESSAGE} * 7 + 10 ))
            TOTAL_WIDTH=$(( LABEL_WIDTH + MESSAGE_WIDTH ))

            cat > .github/badges/frontend-coverage.svg <<EOF
            <svg xmlns="http://www.w3.org/2000/svg" width="${TOTAL_WIDTH}" height="20" role="img" aria-label="${LABEL}: ${MESSAGE}">
              <linearGradient id="s" x2="0" y2="100%">
                <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
                <stop offset="1" stop-opacity=".1"/>
              </linearGradient>
              <clipPath id="r">
                <rect width="${TOTAL_WIDTH}" height="20" rx="3" fill="#fff"/>
              </clipPath>
              <g clip-path="url(#r)">
                <rect width="${LABEL_WIDTH}" height="20" fill="#555"/>
                <rect x="${LABEL_WIDTH}" width="${MESSAGE_WIDTH}" height="20" fill="${COLOR}"/>
                <rect width="${TOTAL_WIDTH}" height="20" fill="url(#s)"/>
              </g>
              <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
                <text x="$(( LABEL_WIDTH / 2 ))" y="15" fill="#010101" fill-opacity=".3">${LABEL}</text>
                <text x="$(( LABEL_WIDTH / 2 ))" y="14">${LABEL}</text>
                <text x="$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" y="15" fill="#010101" fill-opacity=".3">${MESSAGE}</text>
                <text x="$(( LABEL_WIDTH + MESSAGE_WIDTH / 2 ))" y="14">${MESSAGE}</text>
              </g>
            </svg>
            EOF

            if git diff --quiet -- .github/badges/frontend-coverage.svg; then
              echo "No frontend badge changes."
              exit 0
            fi

            git add .github/badges/frontend-coverage.svg
            git commit -m "ci: update frontend coverage badge" || true
            if git push origin main; then
              echo "Frontend coverage badge updated."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}), retrying..."
            sleep 2
          done

          echo "Badge update skipped after retries."

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cat > ~/apps/.env << 'ENVEOF'
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=localhost
            POSTGRES_PORT=5432
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DJANGO_DEBUG=False
            DJANGO_ALLOWED_HOSTS=${{ secrets.DJANGO_ALLOWED_HOSTS }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            ENVEOF

            cd ~/apps/excel-generator-mono
            git pull origin main
            bash scripts/deploy-frontend.sh
