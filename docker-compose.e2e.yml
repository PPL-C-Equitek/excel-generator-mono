services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: excel_generator_e2e
      POSTGRES_USER: excel_e2e
      POSTGRES_PASSWORD: excel_e2e
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U excel_e2e -d excel_generator_e2e"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata-e2e:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: e2e-django-secret
      JWT_SECRET_KEY: e2e-jwt-secret
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      POSTGRES_DB: excel_generator_e2e
      POSTGRES_USER: excel_e2e
      POSTGRES_PASSWORD: excel_e2e
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      GOOGLE_OAUTH_CLIENT_ID: mock-google-client-id
      RESEND_FROM_EMAIL: noreply@example.com
      MEDIA_ROOT: ./media
      CSV_EXPORT_DIR: ./media/exports/csv
      EXCEL_EXPORT_DIR: ./media/exports/excel
      TESSERACT_LANG: eng
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000 --noreload"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: mock-google-client-id
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata-e2e:
